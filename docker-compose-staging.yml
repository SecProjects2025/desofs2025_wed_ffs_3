version: '3.8'

services:
  amap-api:
    image: diogoc0307/odsoft:amap-api
    container_name: amap-api
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - amap-network

networks:
  amap-network:
    driver: bridge 