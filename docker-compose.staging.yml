version: '3.8'

services:
  amap-api:
    image: diogocosta0307/desofs:staging
    container_name: amap-api-staging
    restart: unless-stopped
    ports:
      - "7263:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    networks:
      - amap-network

networks:
  amap-network:
    driver: bridge 