name: .NET Core CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install ReportGenerator tool
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
  
    - name: Convert coverage report to opencover format
      run: |
          reportgenerator \
            -reports:**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:opencover

  build-and-test:
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore AMAP/AMAP.sln

    - name: Build
      run: dotnet build AMAP/AMAP.sln --no-restore

    - name: Run tests with coverage
      run: dotnet test AMAP/AMAP.sln --no-build --collect:"XPlat Code Coverage"

    - name: Run tests
      run: dotnet test AMAP/AMAP.sln --no-build --verbosity normal

    - name: Cache SonarQube Cloud packages
      uses: actions/cache@v4
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v4
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube Cloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ${{ github.workspace }}/.sonar/scanner/dotnet-sonarscanner begin /k:"diogoc0307_desofs" /o:"diogoc0307" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.branch.name="main" /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage-report/opencover.xml" /d:sonar.cs.vstest.reportsPaths="${{ github.workspace }}/**/*.trx" /d:sonar.cs.vstest.coverage.enabled=true /d:sonar.security.enabled=true /d:sonar.security.sources.javasecurity=true /d:sonar.security.sources.pythonsecurity=true /d:sonar.security.sources.phpsecurity=true /d:sonar.security.sources.roslynsecurity=true /d:sonar.scanner.skipJreProvisioning=true
        dotnet build AMAP/AMAP.sln
        ${{ github.workspace }}/.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Run Security Scan
      if: github.ref == 'refs/heads/main'
      uses: snyk/actions/dotnet@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Run SCA (OWASP Dependency Check)
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'diogoc0307_desofs'
        path: '.'
        format: 'HTML'
        out: 'reports'

    - name: Upload SCA Report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: reports

    - name: Generate HTML coverage report
      working-directory: AMAP/AMAP.UnitTests
      run: reportgenerator -reports:**/coverage.cobertura.xml -targetdir:html-coverage-report -reporttypes:Html
  
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
          name: html-coverage-report
          path: AMAP/AMAP.UnitTests/html-coverage-report

    - name: Deploy to Staging
      if: github.ref == 'refs/heads/main'
      id: deploy
      run: |
        echo "Deploying to staging environment"
        # Add your deployment commands here
        # For example:
        # dotnet publish -c Release
        # Copy files to staging server
        echo "deployment_url=https://staging.AMAP.com" >> $GITHUB_OUTPUT
        echo "deployment_status=success" >> $GITHUB_OUTPUT

    - name: Output Deployment Information
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Application deployed successfully!"
        echo "Deployment URL: ${{ steps.deploy.outputs.deployment_url }}"
        echo "Deployment Status: ${{ steps.deploy.outputs.deployment_status }}"

    - name: Verify Deployment
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Verifying deployment..."
        # Add deployment verification steps
        # For example:
        # curl -f https://staging.your-app.com/health
        # Run smoke tests
        # Check application logs